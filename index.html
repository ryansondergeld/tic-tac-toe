<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="status">
    <h4 id="status-text"></h4>
</div>
<div id="player-list">
    <span id="player-1">O:</span><br>
    <span id="player-2">X:</span><br>
</div>
<div id="header">
    <H2 id="turn">Player 1</H2>
</div>
<div id="board">
    <table>
        <tr>
            <td>
                <button id="0" class="input_button"></button>
            </td>
            <td>
                <button id="1" class="input_button"></button>
            </td>
            <td>
                <button id="2" class="input_button"></button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="3" class="input_button"></button>
            </td>
            <td>
                <button id="4" class="input_button"></button>
            </td>
            <td>
                <button id="5" class="input_button"></button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="6" class="input_button"></button>
            </td>
            <td>
                <button id="7" class="input_button"></button>
            </td>
            <td>
                <button id="8" class="input_button"></button>
            </td>
        </tr>
    </table>
</div>
<div id="menu">
    <button id="reset-button">Reset</button><br>
    <h4>Who goes first?</h4>
    <input type="radio" id="random" name="fav-language">
    <label for="random">Random</label>
    <br>
    <input type="radio" id="CPU" name="fav-language">
    <label for="CPU">CPU</label>
    <br>
    <input type="radio" id="player" name="fav-language">
    <label for="player">Player</label>
</div>
<script src="./ts/main.js"></script>
</body>
</html>
